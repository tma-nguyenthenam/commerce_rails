services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ./bin/rails server -b 0.0.0.0
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://commerce:password@db:5432/commerce
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI}
      - PAYMENT_SERVICE_URL=http://payment_service:9292
    depends_on:
      - db
      - payment_service
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle

  db:
    image: postgres:16
    container_name: commerce_api_db
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432" # 5433 để không trùng PostgreSQL cài sẵn trên máy (5432)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce"]
      interval: 3s
      timeout: 3s
      retries: 10

  payment_service:
    build:
      context: ../payment_service
      dockerfile: Dockerfile
    environment:
      GATEWAY_LATENCY: "1"
    ports:
      - "9292:9292"

volumes:
  pgdata:
  bundle: